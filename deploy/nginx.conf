# nginx equivalent. Get the cert with: certbot --nginx -d seating.example.com
server {
    listen 443 ssl http2;
    server_name seating.example.com;

    ssl_certificate     /etc/letsencrypt/live/seating.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seating.example.com/privkey.pem;

    root /var/www/seating;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;

    # Small files that ship as a set — revalidate every load.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name seating.example.com;
    return 301 https://$host$request_uri;
}
